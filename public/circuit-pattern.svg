<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Circuit board traces -->
      <g stroke="#444" stroke-width="0.5" fill="none">
        <!-- Horizontal lines -->
        <line x1="0" y1="10" x2="100" y2="10"/>
        <line x1="0" y1="30" x2="80" y2="30"/>
        <line x1="20" y1="50" x2="100" y2="50"/>
        <line x1="0" y1="70" x2="70" y2="70"/>
        <line x1="30" y1="90" x2="100" y2="90"/>
        
        <!-- Vertical lines -->
        <line x1="15" y1="0" x2="15" y2="60"/>
        <line x1="35" y1="20" x2="35" y2="100"/>
        <line x1="55" y1="0" x2="55" y2="80"/>
        <line x1="75" y1="30" x2="75" y2="100"/>
        <line x1="85" y1="0" x2="85" y2="40"/>
        
        <!-- Connection points -->
        <circle cx="15" cy="10" r="1" fill="#666"/>
        <circle cx="35" cy="30" r="1" fill="#666"/>
        <circle cx="55" cy="50" r="1" fill="#666"/>
        <circle cx="75" cy="70" r="1" fill="#666"/>
        <circle cx="85" cy="30" r="1" fill="#666"/>
        
        <!-- Small rectangles for components -->
        <rect x="40" y="8" width="6" height="4" fill="#555"/>
        <rect x="10" y="48" width="8" height="4" fill="#555"/>
        <rect x="70" y="68" width="6" height="4" fill="#555"/>
        <rect x="60" y="28" width="4" height="6" fill="#555"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#circuit)"/>
</svg>