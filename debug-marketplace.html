<!DOCTYPE html>
<html>
<head>
    <title>Debug Marketplace Toggle</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Marketplace Toggle Debug</h1>
    <div id="output"></div>
    
    <script>
        // Add your Supabase URL and anon key here
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<div>' + new Date().toISOString() + ': ' + message + '</div>';
            console.log(message);
        }
        
        async function debugMarketplace() {
            if (!SUPABASE_URL || !SUPABASE_ANON_KEY || SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                log('Please update the SUPABASE_URL and SUPABASE_ANON_KEY in this file');
                return;
            }
            
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            try {
                // 1. Check if user is authenticated
                const { data: { user }, error: authError } = await supabase.auth.getUser();
                
                if (authError) {
                    log('Auth error: ' + JSON.stringify(authError));
                    return;
                }
                
                log('User: ' + (user ? user.email : 'Not authenticated'));
                
                if (!user) {
                    log('Please log in first');
                    return;
                }
                
                // 2. Check user role
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('user_role')
                    .eq('id', user.id)
                    .single();
                
                if (profileError) {
                    log('Profile error: ' + JSON.stringify(profileError));
                    return;
                }
                
                log('User role: ' + (profile ? profile.user_role : 'Unknown'));
                
                if (profile.user_role !== 'admin') {
                    log('User is not admin');
                    return;
                }
                
                // 3. Try to read system config
                log('Attempting to read system config...');
                const { data: configData, error: readError } = await supabase
                    .from('system_config')
                    .select('*');
                
                if (readError) {
                    log('Read error: ' + JSON.stringify(readError));
                } else {
                    log('Config data: ' + JSON.stringify(configData, null, 2));
                }
                
                // 4. Try to update marketplace
                if (configData && configData.length > 0) {
                    const currentValue = configData[0].marketplace_enabled;
                    const newValue = !currentValue;
                    
                    log(`Attempting to toggle marketplace from ${currentValue} to ${newValue}...`);
                    
                    const { error: updateError } = await supabase
                        .from('system_config')
                        .update({ 
                            marketplace_enabled: newValue,
                            updated_at: new Date().toISOString()
                        })
                        .eq('id', configData[0].id);
                    
                    if (updateError) {
                        log('Update error: ' + JSON.stringify(updateError));
                    } else {
                        log('Update successful!');
                        
                        // 5. Verify the update
                        const { data: verifyData, error: verifyError } = await supabase
                            .from('system_config')
                            .select('marketplace_enabled')
                            .eq('id', configData[0].id)
                            .single();
                        
                        if (verifyError) {
                            log('Verify error: ' + JSON.stringify(verifyError));
                        } else {
                            log('Verified marketplace_enabled: ' + verifyData.marketplace_enabled);
                            log('Update was ' + (verifyData.marketplace_enabled === newValue ? 'SUCCESSFUL' : 'FAILED'));
                        }
                    }
                }
                
            } catch (error) {
                log('Unexpected error: ' + error.message);
            }
        }
        
        // Run the debug when page loads
        window.addEventListener('load', debugMarketplace);
    </script>
</body>
</html>
